[mypy]
# Mypy Configuration for Automated LLM Finetuning Pipeline
# This configuration enforces strict type checking across the entire codebase
# as required by the design document

# ============================================================================
# Basic Configuration
# ============================================================================
# Python version target
python_version = 3.10

# Files to type check
files = src, tests

# Exclude patterns
exclude = (?x)(
    ^venv/
    | ^env/
    | ^\.venv/
    | ^build/
    | ^dist/
    | ^\.eggs/
    | ^\.git/
    | ^\.mypy_cache/
    | ^\.pytest_cache/
    | ^\.hypothesis/
    | ^htmlcov/
    | ^example_judge_prompt_engineer/
    | /__pycache__/
    | /\.
  )

# ============================================================================
# Strict Type Checking Options
# ============================================================================
# Enable strict mode (equivalent to enabling all strict flags)
strict = True

# Strict flags (explicitly listed for clarity, already enabled by strict=True)
# Require type annotations for all functions
disallow_untyped_defs = True
disallow_any_unimported = False
disallow_any_expr = False
disallow_any_decorated = False
disallow_any_explicit = False
disallow_any_generics = True
disallow_subclassing_any = True

# Disallow untyped calls
disallow_untyped_calls = True

# Disallow incomplete type definitions
disallow_incomplete_defs = True

# Check that functions without return type annotations return None
check_untyped_defs = True

# Disallow decorators without type annotations
disallow_untyped_decorators = True

# ============================================================================
# None and Optional Handling
# ============================================================================
# Strict optional checking
strict_optional = True

# Warn about unreachable code
warn_unreachable = True

# Warn about unused ignores
warn_unused_ignores = True

# ============================================================================
# Error Reporting
# ============================================================================
# Show error codes in messages
show_error_codes = True

# Show column numbers in error messages
show_column_numbers = True

# Show error context
show_error_context = True

# Pretty print error messages
pretty = True

# Use color in error messages (if terminal supports it)
color_output = True

# Show absolute paths in error messages
show_absolute_path = False

# Enable pydantic plugin for better dataclass support
plugins = pydantic.mypy

# ============================================================================
# Warnings
# ============================================================================
# Warn about redundant casts
warn_redundant_casts = True

# Warn about unused "type: ignore" comments
warn_unused_configs = True

# Warn when returning Any from a function declared to return a specific type
warn_return_any = True

# Warn about variables that are defined but not used
# Note: This is handled by linters like pylint/flake8
# warn_unused_ignores is already enabled above

# Warn about missing return statements
warn_no_return = True

# ============================================================================
# Import Discovery
# ============================================================================
# Follow imports to check imported modules
follow_imports = normal

# Namespace packages support
namespace_packages = True

# Ignore missing imports for third-party libraries without stubs
# (can be overridden per-module below)
ignore_missing_imports = False

# ============================================================================
# Platform and Environment
# ============================================================================
# Platform to type check for
platform = linux

# ============================================================================
# Incremental Mode
# ============================================================================
# Enable incremental mode for faster subsequent runs
incremental = True

# Cache directory
cache_dir = .mypy_cache

# ============================================================================
# Error Limits
# ============================================================================
# Show all errors (don't stop after first error)
show_error_end = True

# ============================================================================
# Per-Module Configuration
# ============================================================================
# Configuration for specific modules or packages

# Test files - slightly relaxed rules
# Note: Use tests.* for test modules
[mypy-tests.*]
# Allow untyped decorators in tests (e.g., pytest fixtures)
disallow_untyped_decorators = False
# Allow untyped definitions in tests for flexibility
disallow_untyped_defs = False
# Allow incomplete defs in tests
disallow_incomplete_defs = False
# Don't check untyped defs in tests
check_untyped_defs = False

# Third-party libraries without type stubs
# These libraries may not have type hints available

[mypy-boto3.*]
ignore_missing_imports = True

[mypy-botocore.*]
ignore_missing_imports = True

[mypy-sagemaker.*]
ignore_missing_imports = True

[mypy-moto.*]
ignore_missing_imports = True

[mypy-hypothesis.*]
ignore_missing_imports = False

[mypy-pytest.*]
ignore_missing_imports = False

[mypy-streamlit.*]
ignore_missing_imports = True

[mypy-plotly.*]
ignore_missing_imports = True

[mypy-pandas.*]
ignore_missing_imports = False

[mypy-pydantic.*]
ignore_missing_imports = False

[mypy-yaml.*]
ignore_missing_imports = True

[mypy-tenacity.*]
ignore_missing_imports = True

[mypy-jsonschema.*]
ignore_missing_imports = True

[mypy-tqdm.*]
ignore_missing_imports = True

[mypy-unidecode.*]
ignore_missing_imports = True

[mypy-dotenv.*]
ignore_missing_imports = True

[mypy-pythonjsonlogger.*]
ignore_missing_imports = True

[mypy-aioboto3.*]
ignore_missing_imports = True

[mypy-requests.*]
ignore_missing_imports = False

# ============================================================================
# Plugin Configuration
# ============================================================================
# Enable plugins for better type checking of specific libraries

# Pydantic plugin for better dataclass support
# Note: This must be in the [mypy] section, not per-module sections
# plugins = pydantic.mypy

[pydantic-mypy]
init_forbid_extra = True
init_typed = True
warn_required_dynamic_aliases = True
warn_untyped_fields = True

# ============================================================================
# Notes
# ============================================================================
# This configuration enforces:
# 1. Full type annotations with mypy validation (Design requirement)
# 2. Strict type checking configuration (Design requirement)
# 3. Appropriate exclusions for test files and third-party code (Design requirement)
# 4. Integration with development workflow (Design requirement)
#
# To run mypy:
#   mypy src tests
#
# To run mypy on specific files:
#   mypy src/module_name.py
#
# To generate an HTML report:
#   mypy --html-report mypy-report src tests
#
# To check a specific module with verbose output:
#   mypy --verbose src/module_name.py

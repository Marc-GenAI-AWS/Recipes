[pytest]
# Pytest Configuration for Automated LLM Finetuning Pipeline
# This configuration supports unit tests, property-based tests, and integration tests

# Test Discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test Markers
# Use these markers to categorize and selectively run tests
markers =
    unit: Unit tests for individual components
    property: Property-based tests using hypothesis
    integration: Integration tests requiring AWS services (may require credentials)
    slow: Tests that take significant time to run
    aws: Tests that interact with real AWS services
    ui: Tests for Streamlit UI components
    pbt: Property-based tests (alias for property marker)
    aws_integration: Integration tests with real AWS services (requires credentials)
    aws_mock: Tests using moto-mocked AWS services
    requires_sagemaker: Tests requiring SageMaker service
    requires_bedrock: Tests requiring Bedrock service
    requires_s3: Tests requiring S3 service

# Coverage Configuration
# Target: >80% code coverage
# Note: Coverage options require pytest-cov to be installed
# Install with: pip install pytest-cov
addopts =
    # Verbose output
    -v
    # Show summary of all test outcomes
    -ra
    # Show local variables in tracebacks
    --showlocals
    # Enable strict markers (fail on unknown markers)
    --strict-markers
    # Warnings
    --strict-config
    -W error::DeprecationWarning
    -W error::PendingDeprecationWarning
    # Hypothesis profile
    --hypothesis-profile=default

# Coverage options (uncomment when pytest-cov is installed)
# To enable coverage, add these options to addopts above:
#    --cov=src
#    --cov-report=html:htmlcov
#    --cov-report=term-missing
#    --cov-report=xml
#    --cov-branch
#    --cov-fail-under=80

# Test Output
console_output_style = progress
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# File logging during tests
log_file = logs/pytest.log
log_file_level = DEBUG
log_file_format = %(asctime)s [%(levelname)8s] [%(name)s] %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S

# Hypothesis Configuration for Property-Based Testing
# Minimum 100 examples per property test as per design requirements
# Profiles are registered in tests/conftest.py

# Coverage Options
[coverage:run]
source = src
branch = true
omit =
    */tests/*
    */venv/*
    */__pycache__/*
    */site-packages/*
    */example_judge_prompt_engineer/*

[coverage:report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines =
    # Standard pragma
    pragma: no cover
    # Don't complain about missing debug-only code
    def __repr__
    # Don't complain if tests don't hit defensive assertion code
    raise AssertionError
    raise NotImplementedError
    # Don't complain if non-runnable code isn't run
    if __name__ == .__main__.:
    # Don't complain about abstract methods
    @abstractmethod
    @abc.abstractmethod
    # Don't complain about type checking blocks
    if TYPE_CHECKING:
    # Don't complain about protocol methods
    \.\.\.

[coverage:html]
directory = htmlcov

[coverage:xml]
output = coverage.xml

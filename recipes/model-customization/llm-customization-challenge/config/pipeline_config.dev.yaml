# Development Pipeline Configuration
# This configuration is optimized for development and testing with lower costs and faster iterations

# AWS Configuration
aws:
  # AWS region for all services
  region: us-east-1
  
  # Claude Sonnet 4 model ID for Bedrock (data generation and judging)
  bedrock_model_id: anthropic.claude-sonnet-4-20250514-v1:0
  
  # SageMaker execution role ARN (replace with your role)
  # This role needs permissions for SageMaker, S3, and CloudWatch
  sagemaker_role_arn: arn:aws:iam::YOUR_ACCOUNT_ID:role/SageMakerExecutionRole
  
  # S3 bucket for storing training data, model artifacts, and results
  s3_bucket: your-finetuning-dev-bucket
  
  # S3 prefix for organizing files within the bucket
  s3_prefix: dev/finetuning-pipeline

# Training Configuration
training:
  # Base model to finetune (Llama 3.2 3B)
  base_model: meta-llama/Llama-3.2-3B
  
  # SageMaker instance type for training (smaller for dev)
  instance_type: ml.g5.xlarge
  
  # Maximum training time in seconds (1 hour for dev)
  max_training_time_seconds: 3600
  
  # Training volume size in GB
  volume_size_gb: 30
  
  # LoRA configuration for efficient finetuning
  lora_config:
    r: 8  # LoRA rank
    lora_alpha: 16
    target_modules: ["q_proj", "v_proj"]
    lora_dropout: 0.05
  
  # Default hyperparameters (can be overridden by dataset analysis)
  default_hyperparameters:
    epochs: 3
    learning_rate: 0.0002
    batch_size: 4
    warmup_steps: 10
    gradient_accumulation_steps: 4

# Inference Configuration
inference:
  # SageMaker instance type for model deployment (smaller for dev)
  instance_type: ml.g5.xlarge
  
  # Initial instance count for endpoint
  initial_instance_count: 1
  
  # Baseline 70B model endpoint name (must be pre-deployed)
  baseline_model_endpoint: llama-70b-baseline-dev
  
  # Inference parameters
  max_new_tokens: 512
  temperature: 0.7
  top_p: 0.9

# Pipeline Configuration
pipeline:
  # Minimum win rate threshold to avoid triggering self-improvement (60%)
  performance_threshold: 0.60
  
  # Maximum number of self-improvement iterations
  max_iterations: 3  # Lower for dev to save costs
  
  # Enable automatic resource cleanup after pipeline completion
  cleanup_resources: true
  
  # Retention period for training artifacts in days
  artifact_retention_days: 3  # Shorter retention for dev
  
  # Enable detailed progress logging
  verbose_logging: true

# Data Generation Configuration
data_generation:
  # Number of training examples to generate per use case
  num_examples: 500  # Smaller dataset for dev
  
  # Batch size for data generation (examples per API call)
  batch_size: 25
  
  # Enable unicode cleaning for ASCII compliance
  enable_unicode_cleaning: true
  
  # Enable duplicate detection and removal
  enable_deduplication: true

# Retry Configuration
retry:
  # Maximum number of retry attempts for transient errors
  max_attempts: 3
  
  # Initial backoff delay in seconds
  initial_backoff_seconds: 2
  
  # Maximum backoff delay in seconds
  max_backoff_seconds: 30  # Lower for dev to fail faster
  
  # Jitter factor for backoff randomization (0.0 to 1.0)
  jitter_factor: 0.1

# Logging Configuration
logging:
  # Log level (DEBUG, INFO, WARNING, ERROR, CRITICAL)
  level: DEBUG  # More verbose for dev
  
  # Log format
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  
  # Enable structured logging (JSON format)
  structured: true
  
  # Log file path (relative to project root)
  file_path: logs/pipeline_dev.log
  
  # Enable console logging
  console_enabled: true

# Monitoring Configuration
monitoring:
  # Enable CloudWatch metrics
  cloudwatch_enabled: false  # Disabled for dev to save costs
  
  # Metrics namespace
  metrics_namespace: FinetuningPipeline/Dev
  
  # Enable performance tracking
  track_performance: true

# Development-Specific Settings
development:
  # Enable mock mode for testing without AWS calls
  mock_aws_calls: false
  
  # Enable debug endpoints for testing
  debug_endpoints: true
  
  # Skip expensive operations (e.g., full training)
  skip_expensive_ops: false
  
  # Use smaller test datasets
  use_test_datasets: false

# Cost Controls
cost_controls:
  # Maximum cost per pipeline run (USD) - warning only
  max_cost_per_run: 50.0
  
  # Enable cost estimation before execution
  estimate_costs: true
  
  # Require confirmation for expensive operations
  require_confirmation: true

name: Security Check

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  security-scan:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Full history for better secret detection
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install bandit detect-secrets
    
    - name: Run security scanner
      run: |
        python scripts/check_security.py
    
    - name: Scan for secrets with detect-secrets
      run: |
        detect-secrets scan --all-files --force-use-all-plugins
    
    - name: Run Bandit security linter
      run: |
        bandit -r src/ -f json -o bandit-report.json || true
        bandit -r src/ -f screen
      continue-on-error: true
    
    - name: Check for AWS credentials patterns
      run: |
        echo "Checking for AWS credential patterns..."
        if git grep -i "AKIA[0-9A-Z]{16}" -- ':!.github' ':!SECURITY.md' ':!*.example.*'; then
          echo "❌ Found potential AWS access keys!"
          exit 1
        fi
        if git grep -i "aws_secret_access_key\s*=\s*['\"][^'\"]*['\"]" -- ':!.github' ':!SECURITY.md' ':!*.example.*'; then
          echo "❌ Found potential AWS secret keys!"
          exit 1
        fi
        echo "✅ No AWS credentials found"
    
    - name: Check for private keys
      run: |
        echo "Checking for private keys..."
        if git grep -i "BEGIN.*PRIVATE KEY" -- ':!.github' ':!SECURITY.md'; then
          echo "❌ Found potential private keys!"
          exit 1
        fi
        echo "✅ No private keys found"
    
    - name: Verify .gitignore exists
      run: |
        if [ ! -f .gitignore ]; then
          echo "❌ .gitignore file not found!"
          exit 1
        fi
        echo "✅ .gitignore exists"
    
    - name: Check for large files
      run: |
        echo "Checking for large files (>1MB)..."
        large_files=$(find . -type f -size +1M -not -path "./.git/*" -not -path "./venv/*" -not -path "./.hypothesis/*" || true)
        if [ -n "$large_files" ]; then
          echo "⚠️ Found large files:"
          echo "$large_files"
          echo "Consider adding to .gitignore or using Git LFS"
        else
          echo "✅ No large files found"
        fi
    
    - name: Upload Bandit report
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: bandit-security-report
        path: bandit-report.json
    
    - name: Security scan summary
      if: always()
      run: |
        echo "## Security Scan Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "✅ Security checks completed" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "See [SECURITY.md](SECURITY.md) for security guidelines" >> $GITHUB_STEP_SUMMARY

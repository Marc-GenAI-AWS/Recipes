version: 0.2
# CodeBuild: build the x86 training+verifier image and push it to ECR.
# The DLC base lives in AWS's account 763104351884 — log in to both registries.
env:
  variables:
    IMAGE_REPO: ${IMAGE_REPO}
    IMAGE_TAG: latest
    ACCOUNT: "${ACCOUNT_ID}"
    REGION: us-west-2
phases:
  pre_build:
    commands:
      - aws ecr get-login-password --region $REGION | docker login --username AWS --password-stdin 763104351884.dkr.ecr.$REGION.amazonaws.com
      - aws ecr get-login-password --region $REGION | docker login --username AWS --password-stdin $ACCOUNT.dkr.ecr.$REGION.amazonaws.com
  build:
    commands:
      - docker build -t $IMAGE_REPO:$IMAGE_TAG .
      - docker tag $IMAGE_REPO:$IMAGE_TAG $ACCOUNT.dkr.ecr.$REGION.amazonaws.com/$IMAGE_REPO:$IMAGE_TAG
  post_build:
    commands:
      - docker push $ACCOUNT.dkr.ecr.$REGION.amazonaws.com/$IMAGE_REPO:$IMAGE_TAG
      - echo "PUSHED $ACCOUNT.dkr.ecr.$REGION.amazonaws.com/$IMAGE_REPO:$IMAGE_TAG"

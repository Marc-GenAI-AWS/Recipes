<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Citynight — a rain-wet street under its own lights</title>
<meta name="states" content="__STATES__" />
<style>
  :root { --ink: #e6f2f0; --ink-dim: rgba(230,242,240,.42); --ink-mid: rgba(230,242,240,.74); --hairline: rgba(230,242,240,.16); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; background: #041418; }
  canvas#scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #ui { position: fixed; inset: 0; display: flex; flex-direction: column; justify-content: space-between; pointer-events: none; color: var(--ink);
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
  #ui::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 220px; background: linear-gradient(transparent, rgba(2,10,14,.55)); z-index: -1; }
  header { display: flex; justify-content: space-between; align-items: baseline; padding: 22px 28px; }
  .mark { font-size: 12px; font-weight: 500; letter-spacing: .34em; text-shadow: 0 1px 8px rgba(0,0,0,.5); }
  .mark small { letter-spacing: .2em; font-weight: 400; color: var(--ink-dim); margin-left: 1.2em; font-size: 10px; }
  .hint { font-size: 10px; letter-spacing: .12em; color: var(--ink-dim); }
  footer { padding: 0 28px 26px; max-width: 720px; }
  #caption { font-family: Georgia, "Times New Roman", serif; font-style: italic; font-size: 18px; line-height: 1.45; color: var(--ink-mid);
    text-shadow: 0 1px 10px rgba(0,0,0,.6); min-height: 2.9em; transition: opacity .6s; }
  #caption.fade { opacity: 0; }
  nav { display: flex; gap: 8px; margin-top: 16px; pointer-events: auto; flex-wrap: wrap; }
  nav button { appearance: none; background: transparent; border: 1px solid var(--hairline); color: var(--ink-dim); font: inherit; font-size: 10px;
    letter-spacing: .2em; text-transform: uppercase; padding: 8px 14px; border-radius: 16px; cursor: pointer; transition: all .4s; backdrop-filter: blur(6px); }
  nav button:hover { color: var(--ink); border-color: rgba(230,242,240,.4); }
  nav button.on { color: #061418; background: rgba(190, 232, 226, .9); border-color: transparent; }
  @media (max-width: 560px) { #caption { font-size: 15px; } }
</style>
<script type="importmap">
  { "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
  } }
</script>
</head>
<body>
<canvas id="scene"></canvas>
<div id="ui">
  <header><div class="mark">CITYNIGHT <small>WET ASPHALT</small></div><div class="hint">#state in the URL selects a scene</div></header>
  <footer><div id="caption"></div><nav id="nav"></nav></footer>
</div>

<script type="module">
/*__BUNDLE__*/
</script>
</body>
</html>

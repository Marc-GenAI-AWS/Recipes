# Minimal single-node Slurm config for the PoC.
# This file is tuned for an NVIDIA DGX Spark (GB10, 20 cores, ~120 GB RAM, 1 GPU).
# For a real multi-node cluster, replace the NodeName / PartitionName stanzas and
# point SlurmctldHost at your controller.
#
# IMPORTANT: replace `gpu-node-01` below with the output of `hostname -s` on
# your on-prem box (and keep it consistent in gres.conf).

ClusterName=gpu-node-01
SlurmctldHost=gpu-node-01

AuthType=auth/munge
CredType=cred/munge

# JWT is used by slurmrestd. The HS256 key is generated by install-slurm.sh.
AuthAltTypes=auth/jwt
AuthAltParameters=jwt_key=/var/spool/slurm/jwt_hs256.key

ProctrackType=proctrack/linuxproc
TaskPlugin=task/affinity
SwitchType=switch/none
MpiDefault=none

SlurmctldPidFile=/run/slurmctld.pid
SlurmdPidFile=/run/slurmd.pid
SlurmctldPort=6817
SlurmdPort=6818

SlurmdSpoolDir=/var/spool/slurmd
StateSaveLocation=/var/spool/slurmctld
SlurmUser=slurm
SlurmdUser=root

ReturnToService=2

SchedulerType=sched/backfill
SelectType=select/cons_tres
SelectTypeParameters=CR_Core_Memory

GresTypes=gpu

SlurmctldLogFile=/var/log/slurm/slurmctld.log
SlurmdLogFile=/var/log/slurm/slurmd.log

SlurmctldTimeout=120
SlurmdTimeout=300
InactiveLimit=0
MinJobAge=300
KillWait=30
Waittime=0

# --- Compute topology. Replace for your cluster. ---
NodeName=gpu-node-01 CPUs=20 Boards=1 SocketsPerBoard=1 CoresPerSocket=20 ThreadsPerCore=1 RealMemory=120000 Gres=gpu:1 State=UNKNOWN
PartitionName=gpu Nodes=gpu-node-01 Default=YES MaxTime=INFINITE State=UP
